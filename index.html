<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صنایع توانبخشی مداوا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF5F7;
  --surface:#FFFFFF;
  --ink:#2B1F22;
  --ink-soft:#6E5B60;
  --primary:#D94B6A;
  --primary-deep:#A8324D;
  --primary-tint:#FCE4EA;
  --accent:#F28C9D;
  --accent-tint:#FDECEF;
  --line:#EED7DD;
    --radius-a:20px 20px 20px 20px;
    --radius-b:18px 18px 18px 18px;
    --shadow-soft:0 14px 34px -16px rgba(31,66,55,0.35);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Vazirmatn', sans-serif;
    font-size:17px;
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  button, input{font-family:inherit;}
  a{color:inherit;}
  img,svg{display:block;max-width:100%;}
  .wrap{max-width:960px;margin:0 auto;padding:0 24px;}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:6px;}

  /* topbar */
  .topbar{padding:22px 0 6px;}
  .topbar .wrap{display:flex;align-items:center;gap:14px;min-height:34px;}
  .brand{font-weight:800;font-size:1.15rem;color:var(--primary-deep);letter-spacing:.2px;background:none;border:none;cursor:pointer;padding:0;}
  .back-btn{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--surface);border:1px solid var(--line);
    color:var(--ink);font-weight:600;font-size:.92rem;
    padding:9px 16px;border-radius:999px;cursor:pointer;
    transition:background .15s ease, transform .15s ease;
  }
  .back-btn:hover{background:var(--primary-tint);}
  .page-title{font-weight:700;font-size:1.05rem;color:var(--ink);margin-inline-start:4px;}

  /* hero */
  .hero{padding:36px 0 56px;text-align:center;}
  .hero p.msg{
    color:var(--ink-soft);font-size:1.05rem;font-weight:500;
    max-width:34ch;margin:0 auto 10px;
  }
  .hero h1{
    font-size:2.15rem;font-weight:800;line-height:1.45;
    margin:0 0 34px;color:var(--primary-deep);
    max-width:16ch;margin-inline:auto;
  }
  .hero-image-wrap{
    position:relative;width:280px;height:280px;margin:0 auto 34px;
    display:flex;align-items:center;justify-content:center;
  }
  .hero-arc{
    position:absolute;inset:0;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--primary-tint), var(--bg) 72%);
  }
  .hero-image-wrap svg{position:relative;width:190px;height:190px;}
  @media (prefers-reduced-motion:no-preference){
    .hero-image-wrap{animation:settle .7s cubic-bezier(.2,.8,.2,1) both;}
  }
  @keyframes settle{
    from{opacity:0;transform:scale(.85) translateY(10px);}
    to{opacity:1;transform:scale(1) translateY(0);}
  }
  .btn-primary{
    display:inline-block;background:var(--primary);color:#fff;
    font-weight:700;font-size:1.05rem;border:none;cursor:pointer;
    padding:16px 40px;border-radius:var(--radius-b);
    box-shadow:var(--shadow-soft);
    transition:transform .15s ease, background .15s ease;
  }
  .btn-primary:hover{background:var(--primary-deep);transform:translateY(-2px);}
  .btn-primary:active{transform:translateY(0);}

  /* about */
  .about{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-a);
    padding:40px 34px;
    max-width:640px;margin:0 auto 48px;
    text-align:center;
  }
  .about-text p{
  text-align:justify;
  line-height:2;
  }
  .about h2{margin:0 0 14px;font-size:1.3rem;font-weight:700;color:var(--primary-deep);}
  .about p{
  margin:0;
  color:var(--ink-soft);
  font-size:1rem;
  }

  /* footer credit */
  .credit{
    text-align:center;color:var(--ink-soft);
    font-size:.85rem;font-weight:500;
    padding:26px 0 40px;opacity:.85;
  }

  /* category bar */
  .cat-bar{
    display:flex;gap:10px;overflow-x:auto;
    padding:4px 24px 18px;margin:0 0 8px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .cat-bar::-webkit-scrollbar{display:none;}
  .cat-pill{
    flex:0 0 auto;
    padding:10px 22px;border-radius:999px;
    border:1px solid var(--line);background:var(--surface);
    font-size:.92rem;font-weight:600;color:var(--ink-soft);
    cursor:pointer;white-space:nowrap;
    transition:background .15s ease,color .15s ease,border-color .15s ease;
  }
  .cat-pill.active{
    background:var(--primary);border-color:var(--primary);color:#fff;
  }

  /* product grid */
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:20px;padding:8px 0 20px;
  }
  .card{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius-a);overflow:hidden;cursor:pointer;
    text-align:right;transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-soft);}
  .card-img{
    aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .card-img svg{width:78%;height:78%;}
  .card-body{padding:16px 18px 20px;}
  .card-tag{font-size:.78rem;font-weight:600;color:var(--primary);margin:0 0 6px;}
  .card-name{font-size:1rem;font-weight:700;margin:0 0 6px;color:var(--ink);}
  .card-desc{font-size:.87rem;color:var(--ink-soft);margin:0;}
  .empty{text-align:center;color:var(--ink-soft);padding:60px 20px;}

  /* detail */
  .detail{padding:8px 0 20px;}
  .carousel{
    position:relative;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-a);
    padding:30px;
    margin-bottom:22px;
    margin-inline:25px;
    overflow:hidden;
  }
  .carousel-stage{
    aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;
    max-height:320px;
  }
  .carousel-stage svg{width:56%;height:56%;}
  @media (prefers-reduced-motion:no-preference){
    .carousel-stage svg{animation:fadein .35s ease both;}
  }
  @keyframes fadein{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
  .carousel-nav{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:18px;
  }
  .nav-btn{
    background:var(--bg);border:1px solid var(--line);
    width:42px;height:42px;border-radius:50%;
    font-size:1.1rem;font-weight:700;cursor:pointer;color:var(--primary-deep);
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease;
  }
  .nav-btn:hover{background:var(--primary-tint);}
  .dots{display:flex;gap:8px;}
  .dot{
    width:9px;height:9px;border-radius:50%;background:var(--line);
    border:none;cursor:pointer;padding:0;transition:background .15s ease,transform .15s ease;
  }
  .dot.active{background:var(--primary);transform:scale(1.25);}

  .detail-tag{
  font-size:.85rem;
  font-weight:700;
  color:var(--primary);
  margin:0 0 8px;
  padding:0 25px;
  }
  .detail-title{
  font-size:1.5rem;
  font-weight:800;
  margin:0 0 16px;
  color:var(--ink);
  padding:0 25px;
  }
  .detail-desc{
  text-align:justify;
  line-height:2;
  font-size:1rem;
  color:var(--ink-soft);
  max-width:60ch;
  padding:0 25px;
  }

  @media (max-width:480px){
    .hero h1{font-size:1.7rem;}
    .hero-image-wrap{width:220px;height:220px;}
    .hero-image-wrap svg{width:150px;height:150px;}
    .about{padding:30px 22px;}
  }
  .price-box{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-top:20px 0;
}

.price-card{
  flex:0 0 45%;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  padding:16px;
  text-align:center;
}

.price-card span{
  display:block;
  color:var(--muted);
  margin-bottom:8px;
}

.price-card strong{
  font-size:18px;
}
</style>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script>
/* -------------------- icons -------------------- */
function iconToilet(fg){
  return `<svg viewBox="0 0 200 200" aria-hidden="true">
    <rect x="66" y="26" width="68" height="46" rx="12" fill="${fg}" opacity="0.9"/>
    <rect x="74" y="60" width="10" height="20" fill="${fg}" opacity="0.9"/>
    <ellipse cx="100" cy="118" rx="62" ry="34" fill="${fg}"/>
    <ellipse cx="100" cy="118" rx="40" ry="18" fill="#FBFAF6"/>
    <path d="M46 128 Q40 168 62 176 L138 176 Q160 168 154 128 Z" fill="${fg}" opacity="0.85"/>
  </svg>`;
}
function iconWalker(fg){
  return `<svg viewBox="0 0 200 200" aria-hidden="true">
    <rect x="40" y="44" width="16" height="96" rx="8" fill="${fg}"/>
    <rect x="144" y="44" width="16" height="96" rx="8" fill="${fg}"/>
    <rect x="40" y="44" width="120" height="14" rx="7" fill="${fg}"/>
    <rect x="40" y="88" width="120" height="10" rx="5" fill="${fg}" opacity="0.7"/>
    <circle cx="48" cy="150" r="12" fill="${fg}" opacity="0.9"/>
    <circle cx="152" cy="150" r="12" fill="${fg}" opacity="0.9"/>
    <rect x="42" y="140" width="12" height="20" rx="4" fill="${fg}" opacity="0.55"/>
    <rect x="146" y="140" width="12" height="20" rx="4" fill="${fg}" opacity="0.55"/>
  </svg>`;
}
function iconCane(fg, quad){
  const feet = quad
    ? `<circle cx="86" cy="176" r="6" fill="${fg}"/><circle cx="104" cy="180" r="6" fill="${fg}"/>
       <circle cx="90" cy="188" r="0" /><circle cx="98" cy="168" r="6" fill="${fg}"/>`
    : `<ellipse cx="100" cy="180" rx="10" ry="6" fill="${fg}" opacity="0.85"/>`;
  return `<svg viewBox="0 0 200 200" aria-hidden="true">
    <path d="M100 30 q-26 0 -26 26 q0 22 26 22" fill="none" stroke="${fg}" stroke-width="12" stroke-linecap="round"/>
    <rect x="94" y="60" width="12" height="112" rx="6" fill="${fg}"/>
    ${feet}
  </svg>`;
}
function iconAccessory(fg){
  return `<svg viewBox="0 0 200 200" aria-hidden="true">
    <circle cx="46" cy="60" r="16" fill="${fg}" opacity="0.85"/>
    <circle cx="154" cy="140" r="16" fill="${fg}" opacity="0.85"/>
    <path d="M46 60 Q100 60 154 140" fill="none" stroke="${fg}" stroke-width="14" stroke-linecap="round"/>
    <circle cx="46" cy="60" r="6" fill="#FBFAF6"/>
    <circle cx="154" cy="140" r="6" fill="#FBFAF6"/>
  </svg>`;
}
function iconFor(cat, variantIndex, id){
  const colors = ['#2F5D4E', '#C79A3E', '#1F4237'];
  const fg = colors[variantIndex % colors.length];
  if(cat === 'toilet') return iconToilet(fg);
  if(cat === 'walker') return iconWalker(fg);
  if(cat === 'cane') return iconCane(fg, id === 8);
  return iconAccessory(fg);
}

/* -------------------- state -------------------- */
const state = { view:'home', category:'all', productId:null, img:0 };
const app = document.getElementById('app');

function goHome(){ state.view='home'; render(); }
function goProducts(cat){ state.view='products'; if(cat) state.category=cat; render(); }
function setCategory(key){ state.category = key; render(); }
function openProduct(id){ state.view='detail'; state.productId=id; state.img=0; render(); }
function backFromDetail(){ state.view='products'; render(); }
function setImg(i){ state.img = i; render(); }
function nextImg(){
  const p = PRODUCTS.find(x=>x.id===state.productId);
  state.img = (state.img+1) % p.images.length;
  render();
}
function prevImg(){
  const p = PRODUCTS.find(x=>x.id===state.productId);
  state.img = (state.img-1+p.images.length) % p.images.length;
  render();
}

/* -------------------- render -------------------- */
function render(){
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
  if(state.view === 'home') return renderHome();
  if(state.view === 'products') return renderProducts();
  if(state.view === 'detail') return renderDetail();
}

function renderHome(){
  app.innerHTML = `
    <header class="topbar"><div class="wrap">
      <button class="brand" onclick="goHome()">صنایع توانبخشی مداوا</button>
    </div></header>

    <section class="hero wrap">
      <p class="msg">به مداوا خوش آمدید</p>
      <h1>به ما درد دل افشا کن مداوا کردنش با ما </h1>
      <div class="hero-image-wrap">
  <div class="hero-arc"></div>
  <img src="./images/Home-img.jpg" alt="مداوا" style="width:190px;height:190px;object-fit:contain;position:relative;z-index:5;">
</div>
      <button class="btn-primary" onclick="goProducts()">مشاهده محصولات</button>
    </section>

    <section class="wrap">
      <div class="about about-text">
        <h2>درباره مداوا</h2>
        <p>
شرکت مداوا با هدف طراحی و تولید تجهیزات کمک‌حرکتی و بهداشتی، تلاش می‌کند راهکارهایی مطمئن برای افزایش آسایش، استقلال و کیفیت زندگی افراد ارائه دهد.
ما با تمرکز بر تولید انواع توالت‌های فرنگی، واکر، عصا و تجهیزات جانبی، محصولاتی را طراحی می‌کنیم که ترکیبی از استحکام، ایمنی، راحتی و سهولت استفاده باشند. در مداوا، کیفیت ساخت و توجه به نیاز واقعی کاربران، اصلی‌ترین معیار در تولید محصولات است.
هدف ما این است که با ارائه محصولاتی کاربردی و قابل اعتماد، همراهی مطمئن برای خانواده‌ها و افرادی باشیم که به تجهیزات کمک‌حرکتی و بهداشتی نیاز دارند.</p>
      </div>
    </section>
    <section class="wrap">
  <div class="about">
    <h2>تلفن تماس</h2>
    <p>
      جهت دریافت مشاوره، ثبت سفارش و ارتباط با کارشناسان مداوا با ما تماس بگیرید:
      <br>
      09144944249 - 09333169189
    </p>
  </div>
</section>

    <footer class="credit">آدرس : عجب شیر - شهرک صنعتی - کارگر غربی - نبش صنعت ۹ </footer>
  `;
}

function renderProducts(){
  const list = state.category === 'all'
    ? PRODUCTS
    : PRODUCTS.filter(p => p.cat === state.category);

  const pills = CATEGORIES.map(c => `
    <button class="cat-pill ${state.category===c.key?'active':''}" onclick="setCategory('${c.key}')">${c.label}</button>
  `).join('');

  const cards = list.map((p,idx) => `
    <article class="card" onclick="openProduct(${p.id})" role="button" tabindex="0"
      onkeydown="if(event.key==='Enter')openProduct(${p.id})">
      <div class="card-img">
  <img src="${p.imgCard}" alt="${p.name}">
</div>
      <div class="card-body">
        <p class="card-tag">${CATEGORIES.find(c=>c.key===p.cat).label}</p>
        <h3 class="card-name">${p.name}</h3>
        <p class="card-desc">${p.short}</p>
      </div>
    </article>
  `).join('');

  app.innerHTML = `
    <header class="topbar"><div class="wrap">
      <button class="back-btn" onclick="goHome()">بازگشت</button>
      <span class="page-title">محصولات</span>
    </div></header>

    <nav class="cat-bar wrap" style="padding-inline:24px;">${pills}</nav>

    <section class="wrap">
      <div class="grid">${cards || ''}</div>
      ${list.length===0 ? '<p class="empty">محصولی در این دسته‌بندی یافت نشد.</p>' : ''}
    </section>

    <footer class="credit">صنایع توانبخشی مداوا  </footer>
  `;
}

function renderDetail(){
  const p = PRODUCTS.find(x => x.id === state.productId);
  if(!p){ state.view='products'; return renderProducts(); }

  const dots = TINTS.map((_,i) => `
    <button class="dot ${i===state.img?'active':''}" aria-label="تصویر ${i+1}" onclick="setImg(${i})"></button>
  `).join('');

  app.innerHTML = `
    <header class="topbar"><div class="wrap">
      <button class="back-btn" onclick="backFromDetail()">بازگشت</button>
      <span class="page-title">جزئیات محصول</span>
    </div></header>

    <section class="wrap detail">
      <div class="carousel">
        <div class="card-img">
  <img src="${p.images[state.img]}" alt="${p.name}">
</div>
        <div class="carousel-nav">
          <button class="nav-btn" aria-label="تصویر قبلی" onclick="prevImg()">‹</button>
          <div class="dots">${dots}</div>
          <button class="nav-btn" aria-label="تصویر بعدی" onclick="nextImg()">›</button>
        </div>
      </div>

      <p class="detail-tag">${CATEGORIES.find(c=>c.key===p.cat).label}</p>
      <h1 class="detail-title">${p.name}</h1>
      <p class="detail-desc">${p.long}</p>
      <div class="price-box">

  <div class="price-card">
    <span>قیمت نقدی</span>
    <strong>${p.priceCash}</strong>
  </div>

  <div class="price-card">
    <span>قیمت چک ۴۵ روزه</span>
    <strong>${p.priceCheck}</strong>
  </div>

</div>
    </section>
  `;
}

render();
</script>
</body>
</html>
